services:
  - type: web
    name: apexlabs
    runtime: node
    plan: standard
    buildCommand: npm install && npm run build
    # Render runs this after a successful build and before the new process is
    # started. Migrations are strictly ordered and chained with && so the first
    # failed physical schema gate aborts the deployment before the app starts.
    preDeployCommand: npm run db:migrate:discovery-006 && npm run db:migrate:discovery-007 && npm run db:migrate:discovery-008
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: SMTP_HOST
        value: smtp-pulse.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_FROM_EMAIL
        value: coaching@achzodcoaching.com
      # À configurer manuellement dans Render Dashboard :
      # - DATABASE_URL
      # - GEMINI_API_KEY
      # - SESSION_SECRET
      # - SENTRY_DSN (optionnel)
      # - VITE_SENTRY_DSN (optionnel)
      # - SMTP_USER (SendPulse)
      # - SMTP_PASS (SendPulse)
      # - STRIPE_SECRET_KEY
      # - STRIPE_WEBHOOK_SECRET
      # - STRIPE_PEPTIDES_PRICE_ID
      # - ADMIN_SECRET
      # - ADMIN_NOTIFICATION_EMAIL (default: coaching@achzodcoaching.com)
      # - APP_URL (ex: https://apexlabs.achzodcoaching.com)
      # - VITE_GA_MEASUREMENT_ID (Google Analytics 4, ex: G-XXXXXXXXXX)
