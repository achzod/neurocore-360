services:
  - type: web
    name: apexlabs
    runtime: node
    plan: standard
    buildCommand: npm install && npm run build
    # Render runs this after a successful build and before the new process is
    # started. Migrations are strictly ordered and chained with && so the first
    # failed physical schema gate aborts the deployment before the app starts.
    preDeployCommand: npm run db:migrate:discovery-006 && npm run db:migrate:discovery-007 && npm run db:migrate:discovery-008 && npm run db:migrate:discovery-009 && npm run db:migrate:discovery-010 && npm run db:migrate:discovery-011
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Mémoire du conteneur (Standard = 2 Go). Sert aux seuils RSS des crons et
      # du watchdog (server/memoryBudget.ts). Le heap V8 est fixé à 1536 Mo dans
      # le script start de package.json.
      - key: RENDER_MEMORY_LIMIT_MB
        value: 2048
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: SMTP_HOST
        value: smtp-pulse.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_FROM_EMAIL
        value: coaching@achzodcoaching.com
      # À configurer manuellement dans Render Dashboard :
      # - DATABASE_URL
      # - GEMINI_API_KEY
      # - SESSION_SECRET
      # - SENTRY_DSN (optionnel)
      # - VITE_SENTRY_DSN (optionnel)
      # - SMTP_USER (SendPulse)
      # - SMTP_PASS (SendPulse)
      # - STRIPE_SECRET_KEY
      # - STRIPE_WEBHOOK_SECRET
      # - STRIPE_PEPTIDES_PRICE_ID
      # - ADMIN_SECRET
      # - ADMIN_NOTIFICATION_EMAIL (default: coaching@achzodcoaching.com)
      # - APP_URL (ex: https://apexlabs.achzodcoaching.com)
      # Backup autonome chiffré, stockage S3 compatible (R2 recommandé) :
      # - AUTONOMOUS_BACKUP_ENABLED=true
      # - BACKUP_S3_BUCKET
      # - BACKUP_S3_ENDPOINT
      # - BACKUP_S3_REGION=auto
      # - BACKUP_S3_ACCESS_KEY_ID
      # - BACKUP_S3_SECRET_ACCESS_KEY
      # - BACKUP_ENCRYPTION_KEY_B64 (32 octets aléatoires encodés en base64)
      # - BACKUP_S3_PREFIX (optionnel, défaut apexlabs-postgres)
      # - BACKUP_MAX_STORAGE_BYTES (optionnel, défaut 8000000000 pour rester sous le quota R2 gratuit)
      # - VITE_GA_MEASUREMENT_ID (Google Analytics 4, ex: G-XXXXXXXXXX)
